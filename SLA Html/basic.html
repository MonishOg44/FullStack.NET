<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item Table</title>
  <style>
    table {
      width: 360px;
      border: 4px solid 
      font-family: system-ui, sans-serif;
    }
    th, td {
      border: 1px solid #white;
      padding: 8px 10px;
      
    }
    thead th {
      background: #f5f5f5;
      font-weight: 600;
    }th {
      border-bottom: 2px solid #000;
    }
    
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Quantity</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Apples</td>
        <td>2 Kg</td>
        <td>₹200</td>
      </tr>
      <tr>
        <td>Bananas</td>
        <td>1 Dozen</td>
        <td>₹60</td>
      </tr>
    </tbody>
      <tr>
        <td><strong>Total</strong></td>
        <td></td>
        <td><strong>₹260</strong></td>
      </tr>
  </table>
</body>
</html>
