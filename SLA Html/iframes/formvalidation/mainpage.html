<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p contenteditable="true">This is a paragraph</p>
    
    <form action="HomePage.html">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" tabindex="1">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required tabindex="2">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required tabindex="3">
        <br><br>
        <input type="submit" value="Submit" tabindex="4">
        <br><br>
        <textarea id="feedback" name="feedback" placeholder="Enter your feedback here" rows="4" cols="50" tabindex="5"></textarea>
    </form>
</body>
</html>
