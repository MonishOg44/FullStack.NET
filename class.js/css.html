<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            max-width: 1200px;
            width: 90%;
            background-color: rgba(43, 245, 177, 0.685);
            padding: 20px;
            margin: 0 auto;
            display : flex;
            flex-wrap: wrap;
            justify-content: center;

        }
        .inner-container {
            background-color: lightcoral;
            padding: 15px;
            margin-top: 20px;
        }
        .item {
            background-color: lightblue;
            padding: 10px;
            margin: 5px;
            flex: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website</h1>
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <p>This is a sample page with custom CSS.</p></div>
        <div class="inner-container">
            <p>This is an inner container with its own styling.</p></div>
</body>
</html>
