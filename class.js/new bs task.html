<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Task 1: Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyBrand</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Task 2: Card Layout -->
<div class="container my-5">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card h-100">
        <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Service 1">
        <div class="card-body">
          <h5 class="card-title">Service One</h5>
          <p class="card-text">Short description of the first service offered.</p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>
    </div>
    

<!-- Task 3: Buttons + Alert -->
<div class="container my-4">
  <button class="btn btn-primary">Primary</button>
  <button class="btn btn-outline-success">Outline Success</button>
  <button class="btn btn-danger">Danger</button>

  <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
    <strong>Notice:</strong> This is a sample alert box.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- Task 4: Contact Form -->
<div class="container my-5">
  <h2>Contact Us</h2>
  <form>
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="Your Name">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="name@example.com">
    </div>
    <button type="submit" class="btn btn-primary">Send</button>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
