<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 20%;
            background: red;
            margin: 0 auto;
            height: 100px;
            transition: background-color 0.5s ease, transform 0.5s ease;
        }
    .box:hover{
        background-color: blue;
        transform: scale(1.15);
    }
    </style>
</head>
<body>
    <div class="box">
        BOX
    </div>
</body>
</html>
