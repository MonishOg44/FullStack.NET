<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link {
            color: red;
            background-color: yellow;
        }
        a:visited {
            color: brown;
            background-color: aqua;
        }
        a:hover {
            color: green;
            background-color: lightgrey;
        }
        a:active {
            color: burlywood;
            background-color: darkolivegreen;
        }
    </style>
</head>
<body>
    <a href="#para1" style="font-size: 5rem;">link</a>
    <div style="background-color: blueviolet; height: 600px; margin-top: 600px; border: 2px solid black;">
    <p id="para1" style="font-size: larger;">this is a paragraph</p>
    </div>
</body>
</html>
