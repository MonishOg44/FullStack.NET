<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .div  {
        width: 200px;
        height: 200px;
        padding: 30px;
        border: 10px solid black;
        margin: 30px;
        background-color: lightgray;

    }

    .parent {
        width: 300px;
        height: 300px;
        padding: 15px;
        border: 5px solid red;
        margin: 25px;
        background-color: yellow;
    }

    .child {
        margin: 20px;


    }
</style>
<body>
    <div class="parent">
        <div class="child">
            This is the child div.
        </div>
    </div>
</body>
</html>
