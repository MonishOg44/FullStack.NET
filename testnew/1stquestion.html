<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Element selector */
        body {
            font-family: Arial, sans-serif;
            background-color: whitesmoke;
            margin: 20px;
        }

        /* Class selector */
        .container {
            background-color: red;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* ID selector */
        #main-title {
            color: brown;
            text-align: center;
        }

        /* Class selector for paragraphs */
        .intro {
            color: blue;
            font-size: 1.2em;
        }

        /* Class selector for list items */
        .item {
            color: green;
            margin-bottom: 5px;
        }
    </style>
</head>
<body> 
    <div class="container">
        <h1 id="main-title">Welcome to CSS Styling</h1>
        <p class="intro">This is an introduction to CSS selectors.</p>
        <ul>
            <li class="item">Item 1</li>
            <li class="item">Item 2</li>
            <li class="item">Item 3</li>
        </ul>
    </div>
</body>
</html>
