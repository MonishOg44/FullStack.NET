<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            margin: 20px; /* Space outside the box */
            border: 2px solid black; /* Visible outline */
            padding: 10px; /* Space inside the border, around the content */
            background-color: lightgray; /* Optional: to make the box more visible */
        }
    </style>

</head>
<body>  
    <div class="box">
        This is a box with margin, border, and padding.
    </div>

</body>
</html>
